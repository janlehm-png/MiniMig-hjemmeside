<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MiniMig 3D-forsøg</title>
<meta name="robots" content="noindex, nofollow"><!-- (a hidden try-out page: kept out of search engines) -->
<!-- 3D-forsøget: MiniMigs grundfigur (Meshy, skelet og bevægelser fra Mixamo), der kan drejes, vinke, hoppe og danse,
     skifte frisure og farves om. -->
<style>
  :root { --ink: #3A2E5C; --tile: #FFFFFF; --line: #E6DEFF; --accent: #7C5CFF; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #FFF8E1; color: var(--ink); font: 15px/1.3 system-ui, sans-serif; overflow: hidden; }
  /* (the size set here: on a sharp screen - an iPad, a phone - the canvas holds twice the pixels, and without it showed
     twice too big, the figure off to the right) */
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px max(12px, env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom));
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; background: linear-gradient(transparent, rgba(255, 248, 225, .95) 30%); }
  .bar button { border: 2px solid var(--line); background: var(--tile); color: var(--ink); border-radius: 16px; padding: 10px 14px;
    font: 700 15px/1 system-ui, sans-serif; cursor: pointer; }
  .bar button.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
  /* the colours: a part chosen above, its colours as small round buttons below (no pop-up over the figure) */
  .colors { flex-basis: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .parts { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .parts button { padding: 6px 12px; font-size: 13px; border-radius: 12px; }
  .parts[hidden] { display: none; }
  .swatches { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .swatches button { width: 32px; height: 32px; padding: 0; border-radius: 50%; border: 3px solid #FFFFFF; box-shadow: 0 0 0 2px var(--line); }
  .swatches button.on { box-shadow: 0 0 0 3px var(--accent); }
  /* the whole scale: a rainbow button opens three sliders in the bar (colour, strength, light) */
  .swatches button.all { background: conic-gradient(#E8384F, #FFC233, #2FB872, #13BFA6, #3D8BFF, #7A4DFF, #FF6FB1, #E8384F); }
  .sliders[hidden] { display: none; }
  .sliders { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; font-size: 12px; font-weight: 700; }
  .sliders label { display: flex; align-items: center; gap: 6px; }
  .sliders input { width: min(210px, 60vw); height: 22px; border-radius: 11px; -webkit-appearance: none; appearance: none; }
  .sliders input::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; border: 2px solid var(--ink); }
  .sliders input::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; border: 2px solid var(--ink); }
  #s-h { background: linear-gradient(90deg, hsl(0,80%,55%), hsl(60,80%,55%), hsl(120,80%,55%), hsl(180,80%,55%), hsl(240,80%,55%), hsl(300,80%,55%), hsl(360,80%,55%)); }
  .top { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; justify-content: space-between; gap: 8px; pointer-events: none; }
  .top > * { pointer-events: auto; }
  .tag { background: var(--tile); border: 2px solid var(--line); border-radius: 14px; padding: 6px 10px; font-weight: 700; font-size: 13px; }</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="top"><span class="tag" id="tag">Henter figuren …</span></div>
<div class="bar">
  <button data-anim="staa" class="on">Stå</button>
  <button data-anim="vink">Vink</button>
  <button data-anim="hop">Hop</button>
  <button data-anim="dans">Dans</button>
  <button id="spin">Drej rundt</button>
  <div class="colors"><div class="parts" id="parts"></div><div class="parts" id="styles" hidden></div><div class="swatches" id="swatches"></div>
    <div class="sliders" id="sliders" hidden>
      <label>Farve <input type="range" id="s-h" min="0" max="360" step="1"></label>
      <label>Styrke <input type="range" id="s-s" min="0" max="100" step="1"></label>
      <label>Lys <input type="range" id="s-l" min="5" max="95" step="1"></label>
    </div></div>
</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, .1, 100);
camera.position.set(0, 1.25, 6.2);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 1.05, 0); controls.enablePan = false; controls.enableDamping = true;
controls.minDistance = 2.5; controls.maxDistance = 10; controls.minPolarAngle = .5; controls.maxPolarAngle = 1.75;

// light: soft sky light, a warm key light with soft shadow, and a rim light from behind
scene.add(new THREE.HemisphereLight(0xFFFFFF, 0xFFE2A8, 1.4));
const key = new THREE.DirectionalLight(0xFFF4E0, 2.2); key.position.set(2.5, 5, 4); key.castShadow = true;
key.shadow.mapSize.set(1024, 1024); key.shadow.camera.left = -2; key.shadow.camera.right = 2; key.shadow.camera.top = 3; key.shadow.camera.bottom = -1; key.shadow.radius = 6;
scene.add(key);
const rim = new THREE.DirectionalLight(0xD8E6FF, 1.2); rim.position.set(-3, 3, -4); scene.add(rim);
// a soft light from below and in front, as from a light floor: what faces down - the underside of a raised arm and
// sleeve - is not left dark
const fill = new THREE.DirectionalLight(0xFFF1DC, .9); fill.position.set(.5, -2, 3); scene.add(fill);
// the floor: a sunny disc that only catches the shadow
const floor = new THREE.Mesh(new THREE.CircleGeometry(2.2, 48), new THREE.ShadowMaterial({ opacity: .18 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const disc = new THREE.Mesh(new THREE.CircleGeometry(1.4, 48), new THREE.MeshBasicMaterial({ color: 0xFFE07A, transparent: true, opacity: .55 }));
disc.rotation.x = -Math.PI / 2; disc.position.y = .001; scene.add(disc);

// ---- colours: the figure's painted texture, recoloured (below) ----
// (the app's own colours: skin, hair, and its clothes colours)
const CLOTH = ['#E8384F', '#FF7A2F', '#FFC233', '#2FB872', '#13BFA6', '#3D8BFF', '#46699E', '#7A4DFF', '#FF6FB1', '#F4F1EA', '#3A3550'];
const CHOICES = [['skin', 'Hud', ['#F6D0AE', '#EDB98A', '#D9965F', '#B5713F', '#8D5530', '#5A3520']],
  ['hair', 'Hår', ['#2A1C17', '#4A2C1D', '#7A4428', '#A8582E', '#D9A55C', '#F0D9A0', '#FF7EBB', '#5AA9FF']],
  ['shirt', 'Trøje', CLOTH], ['pants', 'Bukser', CLOTH], ['dress', 'Kjole', CLOTH], ['shoe', 'Sko', CLOTH], ['hat', 'Hat', CLOTH], ['glasses', 'Briller', CLOTH]];
const picked = {}, START = { skin: '#EDB98A', hair: '#4A2C1D', shirt: '#FF7A2F', pants: '#2C3E8C', dress: '#3D8BFF', shoe: '#3D8BFF', hat: '#3D8BFF', glasses: '#3D8BFF' }; let partNow = 'shirt', allOpen = false;
const apply = (part, c) => { picked[part] = c; recolour(part, c); };
function showSwatches() { const [part, , list] = CHOICES.find(c => c[0] === partNow), box = document.getElementById('swatches'); box.innerHTML = '';
  for (const c of list) { const b = document.createElement('button'); b.style.background = c; b.setAttribute('aria-label', c); b.classList.toggle('on', !allOpen && picked[part] === c);
    b.onclick = () => { allOpen = false; apply(part, c); showSwatches(); }; box.append(b); }
  const all = document.createElement('button'); all.className = 'all'; all.setAttribute('aria-label', 'Alle farver'); all.classList.toggle('on', allOpen);
  all.onclick = () => { allOpen = !allOpen; showSwatches(); }; box.append(all);
  document.getElementById('sliders').hidden = !allOpen; if (allOpen) slidersFrom(picked[part] || START[part]);
  document.querySelectorAll('#parts button').forEach(b => b.classList.toggle('on', b.dataset.part === partNow));
  renderStyles(); }
// (the styles as buttons above the colours: hairstyles while Hår is chosen, tops while Trøje is; none before the figure)
function renderStyles() { const box = document.getElementById('styles'), list = typeof styleLists === 'undefined' ? null : styleLists()[partNow];
  box.innerHTML = ''; box.hidden = !list || !hairBase;
  if (box.hidden) return; const [items, now, set] = list;
  for (const [n, label] of items) { const b = document.createElement('button'); b.textContent = label; b.classList.toggle('on', n === now); b.onclick = () => set(n); box.append(b); } }
// the sliders: colour (hue), strength (saturation) and light, set from the part's colour now; moving one colours it
const S = { h: document.getElementById('s-h'), s: document.getElementById('s-s'), l: document.getElementById('s-l') };
function slidersFrom(hexColour) { const hsl = {}; new THREE.Color().setStyle(hexColour, THREE.SRGBColorSpace).getHSL(hsl, THREE.SRGBColorSpace);
  S.h.value = Math.round(hsl.h * 360); S.s.value = Math.round(hsl.s * 100); S.l.value = Math.round(hsl.l * 100); paintTracks(); }
function paintTracks() { const h = S.h.value, s = S.s.value, l = S.l.value;
  S.s.style.background = `linear-gradient(90deg, hsl(${h},0%,${l}%), hsl(${h},100%,${l}%))`;
  S.l.style.background = `linear-gradient(90deg, hsl(${h},${s}%,5%), hsl(${h},${s}%,50%), hsl(${h},${s}%,95%))`; }
for (const el of Object.values(S)) el.addEventListener('input', () => { paintTracks();
  const c = '#' + new THREE.Color().setHSL(S.h.value / 360, S.s.value / 100, S.l.value / 100, THREE.SRGBColorSpace).getHexString(THREE.SRGBColorSpace); apply(partNow, c); });
for (const [part, name] of CHOICES) { const b = document.createElement('button'); b.textContent = name; b.dataset.part = part; b.onclick = () => { partNow = part; showSwatches(); }; document.getElementById('parts').append(b); }
showSwatches();

// The AI figure's colours are painted into one picture (its texture). Each pixel of it is sorted once by its colour
// into skin (light peach), shirt (strong orange), trousers (blue) and hair (dark brown); the shoes (red, white), eye
// whites and the rest stay as they are. A new colour for a part is then laid on its pixels, lit as they were (each
// pixel's brightness against the part's middle brightness), so folds and shading stay.
const PARTS = { skin: 1, shirt: 2, pants: 3, hair: 4 };
let tex = null; // { canvas, ctx, src: original pixels, label, mid: middle brightness per part, colours: current per part }
function partOf(r, g, b) {
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), v = mx / 255, s = mx ? (mx - mn) / mx : 0;
  let h = 0; if (mx !== mn) { const d = mx - mn; h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h = (h * 60 + 360) % 360; }
  if (h >= 190 && h <= 250 && s > .3) return PARTS.pants;
  if (v < .42 && s > .25 && v > .06 && h <= 45) return PARTS.hair;
  if (h >= 12 && h <= 40 && s > .72 && v > .55) return PARTS.shirt;
  if (h >= 4 && h <= 45 && s >= .18 && s <= .72 && v > .42) return PARTS.skin;
  return 0; }
function setupTexture(map) {
  const img = map.image, w = img.width, h = img.height, canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d', { willReadFrequently: true }); ctx.drawImage(img, 0, 0);
  const src = ctx.getImageData(0, 0, w, h).data.slice(), label = new Uint8Array(w * h), sums = [0, 0, 0, 0, 0], counts = [0, 0, 0, 0, 0];
  for (let p = 0, i = 0; p < w * h; p++, i += 4) { const l = partOf(src[i], src[i + 1], src[i + 2]); label[p] = l;
    if (l) { sums[l] += .3 * src[i] + .59 * src[i + 1] + .11 * src[i + 2]; counts[l]++; } }
  const mid = sums.map((s, l) => counts[l] ? s / counts[l] : 128);
  // (the eyes' brown irises look like hair: dark brown close to an eye's white - within 8 pixels - stays as it is)
  const white = new Uint8Array(w * h); for (let p = 0, i = 0; p < w * h; p++, i += 4) { const mx = Math.max(src[i], src[i + 1], src[i + 2]), mn = Math.min(src[i], src[i + 1], src[i + 2]); white[p] = mx > 215 && mx - mn < 30 ? 1 : 0; }
  const R = 8, near = new Uint8Array(w * h), row = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0, run = -1e9; x < w; x++) { if (white[y * w + x]) run = x; row[y * w + x] = x - run <= R ? 1 : 0; }
  for (let y = 0; y < h; y++) for (let x = w - 1, run = 1e9; x >= 0; x--) { if (white[y * w + x]) run = x; if (run - x <= R) row[y * w + x] = 1; }
  for (let x = 0; x < w; x++) { for (let y = 0, run = -1e9; y < h; y++) { if (row[y * w + x]) run = y; if (y - run <= R) near[y * w + x] = 1; }
    for (let y = h - 1, run = 1e9; y >= 0; y--) { if (row[y * w + x]) run = y; if (run - y <= R) near[y * w + x] = 1; } }
  for (let p = 0; p < w * h; p++) if (label[p] === PARTS.hair && near[p]) label[p] = 0;
  const t = new THREE.CanvasTexture(canvas); t.flipY = map.flipY; t.colorSpace = map.colorSpace; t.wrapS = map.wrapS; t.wrapT = map.wrapT; t.channel = map.channel;
  tex = { canvas, ctx, src, label, mid, colours: {}, texture: t, w, h };
  return t; }
// (a white vest and shorts, as on the bald base figure, can't be told from the eye whites by their colour: each white
// pixel is sorted by where it sits on the body instead - head and neck stay as they are, the vest down to the waist,
// the shorts below it. Each triangle of the figure, in its T-pose, is painted at its place in the picture)
function whitesByPlace(fbx) {
  if (!tex) return; const c = document.createElement('canvas'); c.width = tex.w; c.height = tex.h;
  const g = c.getContext('2d'); g.lineJoin = 'round';
  // (twice: first with wide edges, so the picture's margins round each piece - which the screen blends in at seams and
  // from afar - get the piece's part too, then exactly)
  for (const wide of [12, 1]) { g.lineWidth = wide; fbx.traverse(o => { if (!o.isMesh || !o.geometry.attributes.uv) return;
    const geo = o.geometry, pos = geo.attributes.position, uv = geo.attributes.uv, ix = geo.index, at = k => ix ? ix.getX(k) : k;
    geo.computeBoundingBox(); const top = geo.boundingBox.max.y, H = top - geo.boundingBox.min.y;
    for (let k = 0, n = ix ? ix.count : pos.count; k < n; k += 3) { const v = [at(k), at(k + 1), at(k + 2)];
      const f = (top - (pos.getY(v[0]) + pos.getY(v[1]) + pos.getY(v[2])) / 3) / H;
      g.fillStyle = g.strokeStyle = f < .2 ? '#000' : f < .53 ? '#f00' : '#0f0'; g.beginPath();
      v.forEach((i, j) => { const x = uv.getX(i) * tex.w, y = (1 - uv.getY(i)) * tex.h; j ? g.lineTo(x, y) : g.moveTo(x, y); });
      g.closePath(); g.fill(); g.stroke(); } }); }
  const place = g.getImageData(0, 0, tex.w, tex.h).data, s = tex.src, sums = [0, 0, 0, 0, 0], counts = [0, 0, 0, 0, 0];
  for (let p = 0, i = 0; p < tex.w * tex.h; p++, i += 4) { const mx = Math.max(s[i], s[i + 1], s[i + 2]), mn = Math.min(s[i], s[i + 1], s[i + 2]);
    if (mx > 75 && mx - mn < .16 * mx) tex.label[p] = place[i] > 128 ? PARTS.shirt : place[i + 1] > 128 ? PARTS.pants : tex.label[p];
    const l = tex.label[p]; if (l) { sums[l] += .3 * s[i] + .59 * s[i + 1] + .11 * s[i + 2]; counts[l]++; } }
  tex.mid = sums.map((v, l) => counts[l] ? v / counts[l] : 128); }
// the hair, a part of its own with its own colour picture: all of it gets the hair colour, lit as it was (against the
// middle brightness of its brown; the hair uses no other part of the picture, and its darkest strands and the edges
// round its pieces must change too, or they show as specks)
// (clothes the same way, in their own list: a top takes the Trøje colour)
const hairTexs = [], clothTexs = [];
function setupHairTexture(img, list = hairTexs) {
  const w = img.width, h = img.height, canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d', { willReadFrequently: true }); ctx.drawImage(img, 0, 0);
  const src = ctx.getImageData(0, 0, w, h).data.slice(), mask = new Uint8Array(w * h); let sum = 0, n = 0;
  for (let p = 0, i = 0; p < w * h; p++, i += 4) { const mx = Math.max(src[i], src[i + 1], src[i + 2]), mn = Math.min(src[i], src[i + 1], src[i + 2]);
    // (the middle brightness of its own colour: brown for hair, blue for clothes - what a new colour is measured against)
    const own = list !== hairTexs ? mx > 25 && (mx - mn) / mx > .25 && mx === src[i + 2] : mx > 15 && mx < 184 && (mx - mn) / mx > .42 && mx === src[i];
    mask[p] = 1; if (own) { sum += .3 * src[i] + .59 * src[i + 1] + .11 * src[i + 2]; n++; } }
  const t = new THREE.CanvasTexture(canvas); t.colorSpace = THREE.SRGBColorSpace;
  list.push({ ctx, src, mask, mid: n ? sum / n : 80, texture: t, w, h }); return t; }
function recolourHair(hexColour, list = hairTexs) {
  const n = parseInt(hexColour.slice(1), 16), c = [(n >> 16 & 255), (n >> 8 & 255), (n & 255)];
  for (const hairTex of list) {
  const out = hairTex.ctx.createImageData(hairTex.w, hairTex.h), o = out.data, s = hairTex.src;
  for (let p = 0, i = 0; p < hairTex.w * hairTex.h; p++, i += 4) { o[i + 3] = 255;
    if (!hairTex.mask[p]) { o[i] = s[i]; o[i + 1] = s[i + 1]; o[i + 2] = s[i + 2]; continue; }
    const k = (.3 * s[i] + .59 * s[i + 1] + .11 * s[i + 2]) / hairTex.mid; for (let j = 0; j < 3; j++) o[i + j] = Math.min(255, c[j] * k); }
  hairTex.ctx.putImageData(out, 0, 0); hairTex.texture.needsUpdate = true; } }
function recolour(part, hexColour) {
  if (part === 'hair') recolourHair(hexColour); if (typeof GARMENTS !== 'undefined' && GARMENTS[part]) recolourHair(hexColour, GARMENTS[part].texs);
  // (the picked colour read straight from its #rrggbb code: a THREE.Color would hold it in linear light, too dark here)
  if (!tex) return; const n = parseInt(hexColour.slice(1), 16); tex.colours[PARTS[part]] = { r: (n >> 16 & 255) / 255, g: (n >> 8 & 255) / 255, b: (n & 255) / 255 };
  redrawBody(); }
// (under a dress the vest and shorts are painted in the skin's colour: they would show at the neckline, under the arms
// and through a tight skirt)
function redrawBody() {
  if (!tex) return; const out = tex.ctx.createImageData(tex.w, tex.h), o = out.data, s = tex.src;
  if (!tex.skin) { let r = 0, g = 0, b = 0, m = 0; for (let p = 0, i = 0; p < tex.w * tex.h; p++, i += 4) if (tex.label[p] === PARTS.skin) { r += s[i]; g += s[i + 1]; b += s[i + 2]; m++; }
    tex.skin = { r: r / m / 255, g: g / m / 255, b: b / m / 255 }; }
  for (let p = 0, i = 0; p < tex.w * tex.h; p++, i += 4) { const l = tex.label[p];
    const c = tex.dressed && (l === PARTS.shirt || l === PARTS.pants) ? tex.colours[PARTS.skin] || tex.skin : tex.colours[l];
    if (!c) { o[i] = s[i]; o[i + 1] = s[i + 1]; o[i + 2] = s[i + 2]; o[i + 3] = 255; continue; }
    const k = (.3 * s[i] + .59 * s[i + 1] + .11 * s[i + 2]) / tex.mid[tex.label[p]];
    o[i] = Math.min(255, c.r * 255 * k); o[i + 1] = Math.min(255, c.g * 255 * k); o[i + 2] = Math.min(255, c.b * 255 * k); o[i + 3] = 255; }
  tex.ctx.putImageData(out, 0, 0); tex.texture.needsUpdate = true; }

let anim = 'staa', spin = false;
// the figure stands in a holder, which "Drej rundt" turns (hidden until the figure, its hair and its movements are all
// in: no bald T-pose for a moment)
const holder = new THREE.Group(); holder.visible = false; scene.add(holder); let spinAngle = 0;
document.querySelectorAll('[data-anim]').forEach(b => b.onclick = () => { anim = b.dataset.anim;
  if (glb && glbActions[anim]) { Object.values(glbActions).forEach(x => x.fadeOut(.3)); glbActions[anim].reset().fadeIn(.3).play(); }
  document.querySelectorAll('[data-anim]').forEach(x => x.classList.toggle('on', x === b)); });
document.getElementById('spin').onclick = e => { spin = !spin; e.target.classList.toggle('on', spin); };

// ---- the figure ----
let glb = null, mixer = null; const glbActions = {};
const exists = async u => { try { return (await fetch(u, { method: 'HEAD' })).ok; } catch (e) { return false; } };
// a figure with a skeleton made in Mixamo: figur.fbx (the figure, its skeleton and its first movement,
// the waving) and figur-staa/hop/dans.fbx (more movements for the same skeleton). Mixamo leaves the figure grey: its
// colours come from figur-farve.jpg, Meshy's painted texture. Buttons without a movement are hidden.
// the hairstyles: <name>.json (the hair cut out of a Meshy head by haar-ud.ps1, with that head's eye whites) and
// <name>.jpg. Each is set on the figure's head so the eyes meet - as far apart and in the same place as the figure's
// own eye whites - and then follows the head bone. A style is fetched the first time it is chosen.
