<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MiniMig 3D-forsøg</title>
<meta name="robots" content="noindex, nofollow"><!-- (a hidden try-out page: kept out of search engines) -->
<!-- 3D-forsøget: MiniMigs grundfigur (Meshy, skelet og bevægelser fra Mixamo), der kan drejes, vinke, hoppe og danse,
     skifte frisure og farves om. -->
<style>
  :root { --ink: #3A2E5C; --tile: #FFFFFF; --line: #E6DEFF; --accent: #7C5CFF; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #FFF8E1; color: var(--ink); font: 15px/1.3 system-ui, sans-serif; overflow: hidden; }
  /* (the size set here: on a sharp screen - an iPad, a phone - the canvas holds twice the pixels, and without it showed
     twice too big, the figure off to the right) */
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px max(12px, env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom));
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; background: linear-gradient(transparent, rgba(255, 248, 225, .95) 30%); }
  .bar button { border: 2px solid var(--line); background: var(--tile); color: var(--ink); border-radius: 16px; padding: 10px 14px;
    font: 700 15px/1 system-ui, sans-serif; cursor: pointer; }
  .bar button.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
  /* (the movements too, each with a little picture of the figure doing it - ikoner/stilling-*.png, made by the page) */
  .bar button.pose { padding: 4px 10px 6px; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .bar button.pose img { width: 48px; height: 48px; pointer-events: none; }
  .bar button.pose span { pointer-events: none; }
  /* the colours: a part chosen above, its colours as small round buttons below (no pop-up over the figure) */
  .colors { flex-basis: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .parts { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .parts button { padding: 4px 8px 6px; font-size: 12px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  /* (each part and each choice with its picture over its name, as in the app - the children cannot read yet) */
  .parts button img { width: 40px; height: 40px; object-fit: contain; }
  #styles button img { width: 52px; height: 52px; border-radius: 10px; }
  .parts[hidden] { display: none; }
  /* the colours: three sliders (colour, strength, light) for the part chosen - no fixed colours */
  .sliders[hidden] { display: none; }
  .sliders { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; font-size: 12px; font-weight: 700; }
  .sliders label { display: flex; align-items: center; gap: 6px; }
  .sliders input { width: min(210px, 60vw); height: 22px; border-radius: 11px; -webkit-appearance: none; appearance: none; }
  .sliders input::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; border: 2px solid var(--ink); }
  .sliders input::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; border: 2px solid var(--ink); }
  #s-h { background: linear-gradient(90deg, hsl(0,80%,55%), hsl(60,80%,55%), hsl(120,80%,55%), hsl(180,80%,55%), hsl(240,80%,55%), hsl(300,80%,55%), hsl(360,80%,55%)); }
  .top { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; justify-content: space-between; gap: 8px; pointer-events: none; }
  .top > * { pointer-events: auto; }
  .tag { background: var(--tile); border: 2px solid var(--line); border-radius: 14px; padding: 6px 10px; font-weight: 700; font-size: 13px; }</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="top"><span class="tag" id="tag">Henter figuren …</span></div>
<div class="bar">
  <button data-anim="staa" class="on pose"><img src="ikoner/stilling-staa.png" alt=""><span>Stå</span></button>
  <button data-anim="vink" class="pose"><img src="ikoner/stilling-vink.png" alt=""><span>Vink</span></button>
  <button data-anim="hop" class="pose"><img src="ikoner/stilling-hop.png" alt=""><span>Hop</span></button>
  <button data-anim="dans" class="pose"><img src="ikoner/stilling-dans.png" alt=""><span>Dans</span></button>
  <button id="spin" class="pose"><img src="ikoner/stilling-drej.png" alt=""><span>Drej rundt</span></button>
  <div class="colors"><div class="parts" id="parts"></div><div class="parts" id="styles" hidden></div>
    <div class="sliders" id="sliders">
      <label>Farve <input type="range" id="s-h" min="0" max="360" step="1"></label>
      <label>Styrke <input type="range" id="s-s" min="0" max="100" step="1"></label>
      <label>Lys <input type="range" id="s-l" min="5" max="95" step="1"></label>
    </div></div>
</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

const canvas = document.getElementById('scene');

renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, .1, 100);
camera.position.set(0, 1.25, 6.2);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 1.05, 0); controls.enablePan = false; controls.enableDamping = true;controls.minDistance = 2.5; controls.maxDistance = 10; controls.minPolarAngle = .5; controls.maxPolarAngle = 1.75;// light: soft sky light, a warm key light with soft shadow, and a rim light from behind
scene.add(new THREE.HemisphereLight(0xFFFFFF, 0xFFE2A8, 1.4));
const key = new THREE.DirectionalLight(0xFFF4E0, 2.2); key.position.set(2.5, 5, 4); key.castShadow = true;

scene.add(key);
const rim = new THREE.DirectionalLight(0xD8E6FF, 1.2); rim.position.set(-3, 3, -4); scene.add(rim);
// a soft light from below and in front, as from a light floor: what faces down - the underside of a raised arm and
// sleeve - is not left dark
const fill = new THREE.DirectionalLight(0xFFF1DC, .9); fill.position.set(.5, -2, 3); scene.add(fill);
// the floor: a sunny disc that only catches the shadow
const floor = new THREE.Mesh(new THREE.CircleGeometry(2.2, 48), new THREE.ShadowMaterial({ opacity: .18 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const disc = new THREE.Mesh(new THREE.CircleGeometry(1.4, 48), new THREE.MeshBasicMaterial({ color: 0xFFE07A, transparent: true, opacity: .55 }));
disc.rotation.x = -Math.PI / 2; disc.position.y = .001; scene.add(disc);

// ---- colours: the figure's painted texture, recoloured (below) ----
// (the parts, each with the app's icon for its tab, in ikoner/; the fixed colours are gone - the sliders alone)
const CHOICES = [['skin', 'Hud', 'hud'], ['hair', 'Hår', 'haar'], ['eyes', 'Øjne', 'oejne'], ['brows', 'Bryn', 'bryn'], ['mouth', 'Mund', 'mund'], ['shirt', 'Trøje', 'troeje'], ['pants', 'Bukser', 'bukser'], ['dress', 'Kjole', 'kjoler'],
  ['shoe', 'Sko', 'sko'], ['hat', 'Hat', 'hat'], ['glasses', 'Briller', 'briller']];
const picked = {}, START = { skin: '#EDB98A', hair: '#4A2C1D', eyes: '#7A4220', brows: '#4A2C1D', mouth: '#C0505A', shirt: '#FF7A2F', pants: '#2C3E8C', dress: '#3D8BFF', shoe: '#3D8BFF', hat: '#3D8BFF', glasses: '#3D8BFF' }; let partNow = 'shirt';
const apply = (part, c) => { picked[part] = c; recolour(part, c); };
const iconButton = (src, label) => { const b = document.createElement('button'), i = new Image(); i.src = src; i.alt = ''; i.onerror = () => i.remove();
  const s = document.createElement('span'); s.textContent = label; b.append(i, s); return b; };
// (the mouth has no colour of its own, as in the app: no sliders under it)
function showSwatches() { slidersFrom(picked[partNow] || START[partNow]); document.getElementById('sliders').style.display = partNow === 'mouth' ? 'none' : '';
  document.querySelectorAll('#parts button').forEach(b => b.classList.toggle('on', b.dataset.part === partNow));
  renderStyles(); }
// (the styles as buttons above the colours: hairstyles while Hår is chosen, tops while Trøje is; none before the figure -
// each with a little picture of the figure wearing it, ikoner/valg-<name>.png, made by the page itself: see LÆS-MIG)
function renderStyles() { const box = document.getElementById('styles'), list = typeof styleLists === 'undefined' ? null : styleLists()[partNow];
  box.innerHTML = ''; box.hidden = !list || !hairBase;
  if (box.hidden) return; const [items, now, set] = list;
  for (const [n, label] of items) { const b = iconButton(`ikoner/valg-${n || 'ingen-' + partNow}.png`, label); b.classList.toggle('on', n === now); b.onclick = () => set(n); box.append(b); } }
// the sliders: colour (hue), strength (saturation) and light, set from the part's colour now; moving one colours it
const S = { h: document.getElementById('s-h'), s: document.getElementById('s-s'), l: document.getElementById('s-l') };
function slidersFrom(hexColour) { const hsl = {}; new THREE.Color().setStyle(hexColour, THREE.SRGBColorSpace).getHSL(hsl, THREE.SRGBColorSpace);
  S.h.value = Math.round(hsl.h * 360); S.s.value = Math.round(hsl.s * 100); S.l.value = Math.round(hsl.l * 100); paintTracks(); }
function paintTracks() { const h = S.h.value, s = S.s.value, l = S.l.value;
  S.s.style.background = `linear-gradient(90deg, hsl(${h},0%,${l}%), hsl(${h},100%,${l}%))`;
  S.l.style.background = `linear-gradient(90deg, hsl(${h},${s}%,5%), hsl(${h},${s}%,50%), hsl(${h},${s}%,95%))`; }
for (const el of Object.values(S)) el.addEventListener('input', () => { paintTracks();
  const c = '#' + new THREE.Color().setHSL(S.h.value / 360, S.s.value / 100, S.l.value / 100, THREE.SRGBColorSpace).getHexString(THREE.SRGBColorSpace); apply(partNow, c); });
for (const [part, name, icon] of CHOICES) { const b = iconButton(`ikoner/${icon}.png`, name); b.dataset.part = part; b.onclick = () => { partNow = part; showSwatches(); lookFor(part); }; document.getElementById('parts').append(b); }
showSwatches();

// The AI figure's colours are painted into one picture (its texture). Each pixel of it is sorted once by its colour
// into skin (light peach), shirt (strong orange), trousers (blue) and hair (dark brown); the shoes (red, white), eye
// whites and the rest stay as they are. A new colour for a part is then laid on its pixels, lit as they were (each
// pixel's brightness against the part's middle brightness), so folds and shading stay.
const PARTS = { skin: 1, shirt: 2, pants: 3, hair: 4, eyes: 5, brows: 6 };
let tex = null; // { canvas, ctx, src: original pixels, label, mid: middle brightness per part, colours: current per part }
function partOf(r, g, b) {
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), v = mx / 255, s = mx ? (mx - mn) / mx : 0;

  if (h >= 190 && h <= 250 && s > .3) return PARTS.pants;
  if (v < .42 && s > .25 && v > .06 && h <= 45) return PARTS.hair;
  if (h >= 12 && h <= 40 && s > .72 && v > .55) return PARTS.shirt;

  return 0; }

  const ctx = canvas.getContext('2d', { willReadFrequently: true }); ctx.drawImage(img, 0, 0);
  const src = ctx.getImageData(0, 0, w, h).data.slice(), label = new Uint8Array(w * h), sums = [0, 0, 0, 0, 0], counts = [0, 0, 0, 0, 0];
  for (let p = 0, i = 0; p < w * h; p++, i += 4) { const l = partOf(src[i], src[i + 1], src[i + 2]); label[p] = l;

  for (let y = 0; y < h; y++) for (let x = w - 1, run = 1e9; x >= 0; x--) { if (white[y * w + x]) run = x; if (run - x <= R) row[y * w + x] = 1; }
  for (let x = 0; x < w; x++) { for (let y = 0, run = -1e9; y < h; y++) { if (row[y * w + x]) run = y; if (y - run <= R) near[y * w + x] = 1; }

  const g = c.getContext('2d'); g.lineJoin = 'round';

  // from afar - get the piece's part too, then exactly)

    if (mx > 75 && mx - mn < .16 * mx) tex.label[p] = place[i] > 128 ? PARTS.shirt : place[i + 1] > 128 ? PARTS.pants : tex.label[p];
    const l = tex.label[p]; if (l) { sums[l] += .3 * s[i] + .59 * s[i + 1] + .11 * s[i + 2]; counts[l]++; } }
  tex.mid = sums.map((v, l) => counts[l] ? v / counts[l] : 128);
  // (round the underwear a grey seam of no part's colour - its shadow and edge - within 10 pixels of it: under a dress it
  // is painted over too, or it shows as the vest's outline)
  // (grey within 40 pixels - the shorts' hems have wide shadows - and skin right at its edge, within 10: a thin darker line
  // there is painted as skin too. Each seam pixel belongs to the vest or the shorts by its place on the body)
  const R = 40, w = tex.w, h = tex.h, under = new Uint8Array(w * h), row = new Int16Array(w * h).fill(R + 1), far = new Int16Array(w * h).fill(R + 1); tex.seam = new Uint8Array(w * h);

    for (let x = w - 1, run = 1e9; x >= 0; x--) { if (under[y * w + x]) run = x; row[y * w + x] = Math.min(row[y * w + x], run - x); } }

  // (only on the body: pieces of the face lie near the vest's in the picture, and the eyes were painted over)
  for (let p = 0; p < w * h; p++) if ((place[p * 4] > 128 || place[p * 4 + 1] > 128) && (!tex.label[p] && far[p] <= R || tex.label[p] === PARTS.skin && far[p] <= 10)) tex.seam[p] = place[p * 4 + 1] > 128 ? PARTS.pants : PARTS.shirt;

  // pixels wide - an edge of the vest is then no lighter or darker than the skin it meets)

  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const p = y * w + x, i = p * 4, sk = tex.label[p] === PARTS.skin && !tex.seam[p], a = (y + 1) * (w + 1) + x + 1;

  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const p = y * w + x; if (!under[p] && !tex.seam[p]) continue;
    const x0 = Math.max(0, x - B), y0 = Math.max(0, y - B), x1 = Math.min(w, x + B + 1), y1 = Math.min(h, y + B + 1), c = box(C, x0, y0, x1, y1);

// (the irises, a part of their own: on the head, each a patch of what is neither skin nor white that meets an eye's

function irisesByPlace(place) {

    for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) { const X = x + dx, Y = y + dy; if (X >= 0 && Y >= 0 && X < w && Y < h && !pure[Y * w + X]) pure[Y * w + X] = 2; } pure[p] = 2; }
  // (brown or near-black, darker than the skin - its middle brown is sorted as skin by its colour - and not the grey of
  // the vest's pieces round the neck)
  const brown = p => { const mx = Math.max(s[p * 4], s[p * 4 + 1], s[p * 4 + 2]), mn = Math.min(s[p * 4], s[p * 4 + 1], s[p * 4 + 2]); return mx < 90 || mx < 180 && mx - mn > .3 * mx && mx === s[p * 4]; };
  const may = new Uint8Array(w * h); for (let p = 0; p < w * h; p++) may[p] = place[p * 4] < 128 && place[p * 4 + 1] < 128 && brown(p);
  const seen = new Uint8Array(w * h);
  for (let p = 0; p < w * h; p++) { if (!may[p] || seen[p]) continue; const patch = [p]; let touch = 0; seen[p] = 1;
    for (let j = 0; j < patch.length; j++) { const q = patch[j], x = q % w;

// (the face's parts - the eyes so far - are shown close up: the camera glides in front of the face, and out again to the
// whole figure when another tab is chosen; dragging and pinching still work in between)
const FACE = ['eyes', 'brows', 'mouth']; let farZ = 8, closeUp = false, goal = null;
function lookFor(part) { const near = FACE.includes(part) && hairBase;
  if (near) { const at = hairBase.body.skeleton.bones[hairBase.head].getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0, .15, 0));
    controls.minDistance = .5; goal = { target: at, camera: at.clone().add(new THREE.Vector3(0, .04, 1.5)) }; }
  else if (closeUp) goal = { target: new THREE.Vector3(0, 1.05, 0), camera: new THREE.Vector3(0, 1.25, farZ), far: true };
  closeUp = !!near; }
function glide() { if (!goal) return; controls.target.lerp(goal.target, .12); camera.position.lerp(goal.camera, .12);
  if (camera.position.distanceTo(goal.camera) < .01) { controls.target.copy(goal.target); camera.position.copy(goal.camera); if (goal.far) controls.minDistance = 2.5; goal = null; } }
// (the picture moved up by half the button bar's height, so the figure stands clear of the bar however tall it is)
function resize() { const w = innerWidth, h = innerHeight, bar = document.querySelector('.bar').offsetHeight; renderer.setSize(w, h, false); camera.aspect = w / h;
  farZ = w < h ? 8 : 7; if (!closeUp) camera.position.z = farZ; camera.setViewOffset(w, h, 0, bar * .4, w, h); /* (room above for the head in a hop) */ camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize(); new ResizeObserver(resize).observe(document.querySelector('.bar'));
renderer.setAnimationLoop(() => { const dt = clock.getDelta(), t = clock.getElapsedTime();
  if (spin) spinAngle += dt * 1.2; glb && (glb.rotation.y = spinAngle);
  if (mixer) mixer.update(dt); armsOut(); glide(); controls.update(); renderer.render(scene, camera); });</script>
