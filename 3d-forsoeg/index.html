<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MiniMig 3D-forsøg</title>
<meta name="robots" content="noindex, nofollow"><!-- (a hidden try-out page: kept out of search engines) -->
<!-- 3D-forsøget: MiniMigs grundfigur (Meshy, skelet og bevægelser fra Mixamo), der kan drejes, vinke, hoppe og danse,
     skifte frisure og farves om. -->
<style>
  :root { --ink: #3A2E5C; --tile: #FFFFFF; --line: #E6DEFF; --accent: #7C5CFF; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #FFF8E1; color: var(--ink); font: 15px/1.3 system-ui, sans-serif; overflow: hidden; }
  /* (the size set here: on a sharp screen - an iPad, a phone - the canvas holds twice the pixels, and without it showed
     twice too big, the figure off to the right) */
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px max(12px, env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom));
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; background: linear-gradient(transparent, rgba(255, 248, 225, .95) 30%); }
  .bar button { border: 2px solid var(--line); background: var(--tile); color: var(--ink); border-radius: 16px; padding: 10px 14px;
    font: 700 15px/1 system-ui, sans-serif; cursor: pointer; }
  .bar button.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
  /* the colours: a part chosen above, its colours as small round buttons below (no pop-up over the figure) */
  .colors { flex-basis: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .parts { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .parts button { padding: 6px 12px; font-size: 13px; border-radius: 12px; }
  .parts[hidden] { display: none; }
  .swatches { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .swatches button { width: 32px; height: 32px; padding: 0; border-radius: 50%; border: 3px solid #FFFFFF; box-shadow: 0 0 0 2px var(--line); }
  .swatches button.on { box-shadow: 0 0 0 3px var(--accent); }
  /* the whole scale: a rainbow button opens three sliders in the bar (colour, strength, light) */
  .swatches button.all { background: conic-gradient(#E8384F, #FFC233, #2FB872, #13BFA6, #3D8BFF, #7A4DFF, #FF6FB1, #E8384F); }
  .sliders[hidden] { display: none; }
  .sliders { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; font-size: 12px; font-weight: 700; }
  .sliders label { display: flex; align-items: center; gap: 6px; }
  .sliders input { width: min(210px, 60vw); height: 22px; border-radius: 11px; -webkit-appearance: none; appearance: none; }
  .sliders input::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; border: 2px solid var(--ink); }
  .sliders input::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; border: 2px solid var(--ink); }
  #s-h { background: linear-gradient(90deg, hsl(0,80%,55%), hsl(60,80%,55%), hsl(120,80%,55%), hsl(180,80%,55%), hsl(240,80%,55%), hsl(300,80%,55%), hsl(360,80%,55%)); }
  .top { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; justify-content: space-between; gap: 8px; pointer-events: none; }
  .top > * { pointer-events: auto; }
  .tag { background: var(--tile); border: 2px solid var(--line); border-radius: 14px; padding: 6px 10px; font-weight: 700; font-size: 13px; }</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="top"><span class="tag" id="tag">Henter figuren …</span></div>
<div class="bar">
  <button data-anim="staa" class="on">Stå</button>
  <button data-anim="vink">Vink</button>
  <button data-anim="hop">Hop</button>
  <button data-anim="dans">Dans</button>
  <button id="spin">Drej rundt</button>
  <div class="colors"><div class="parts" id="parts"></div><div class="parts" id="styles" hidden></div><div class="swatches" id="swatches"></div>
    <div class="sliders" id="sliders" hidden>
      <label>Farve <input type="range" id="s-h" min="0" max="360" step="1"></label>
      <label>Styrke <input type="range" id="s-s" min="0" max="100" step="1"></label>
      <label>Lys <input type="range" id="s-l" min="5" max="95" step="1"></label>
    </div></div>
</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">

  box.innerHTML = ''; box.hidden = !list || !hairBase;
