<style>
/* Layout: the figure on a sunny stage (the app icon's light), the wardrobe beside it; stacked on a phone. */
:root {
  --sun: #FFD54A; --sun-soft: #FFF3C2; --ground: #FFFDF6; --ink: #2B2153; --muted: #6E6496;
  --grape: #7A4DFF; --tile: #FFFFFF; --line: #EDE6D2; --shadow: rgba(43, 33, 83, .12); --group: #F1ECFF;
  --font-display: "Fredoka", ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
  --font-body: "Nunito", ui-rounded, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --sun: #E0B43A; --sun-soft: #3A2F5E; --ground: #1D1738; --ink: #F5F1FF; --muted: #B7AEDB;
  --grape: #A98BFF; --tile: #2A2350; --line: #3B3266; --shadow: rgba(0, 0, 0, .35); --group: #251E47; color-scheme: dark } }
:root[data-theme="dark"] {
  --sun: #E0B43A; --sun-soft: #3A2F5E; --ground: #1D1738; --ink: #F5F1FF; --muted: #B7AEDB;
  --grape: #A98BFF; --tile: #2A2350; --line: #3B3266; --shadow: rgba(0, 0, 0, .35); --group: #251E47; color-scheme: dark }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font: 600 15px/1.45 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1000px; margin: 0 auto; padding-block: 18px 32px; display: grid; gap: 18px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.logo { font: 700 1.9rem/1 var(--font-display); display: flex; }
.logo span:nth-child(6n+1) { color: #FF4F8B } .logo span:nth-child(6n+2) { color: #FF7A2F }
.logo span:nth-child(6n+3) { color: #F2A900 } .logo span:nth-child(6n+4) { color: #13BFA6 }
.logo span:nth-child(6n+5) { color: #3D8BFF } .logo span:nth-child(6n+6) { color: var(--grape) }
.tag { font: 600 .8rem/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 20px; align-items: start; }
.stage { position: relative; border-radius: 28px; aspect-ratio: 2 / 3; max-width: 100%;
  background: radial-gradient(circle at 50% 42%, var(--sun-soft) 0 38%, var(--sun) 100%); box-shadow: 0 10px 30px var(--shadow); overflow: hidden; }
.stage { cursor: zoom-in; }
.stage.zoomed { cursor: zoom-out; }
/* everything on the stage (scene, shadow, figure) zooms together, e.g. in on the face for the Eyes tab */
.stage .zoom { position: absolute; inset: 0; transform-origin: 0 0; background-size: cover; background-position: center; }
@media (prefers-reduced-motion: no-preference) { .stage .zoom { transition: transform .45s ease; } }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.stage .shadow { position: absolute; left: 30%; right: 30%; bottom: 13.5%; height: 3%; border-radius: 50%; background: rgba(43, 33, 83, .16); filter: blur(4px); }
/* the figure stands a little smaller than the stage, feet on the same spot, the same size on the sun and on a scene */
.stage canvas, .stage .shadow { transform: scale(.86); transform-origin: 50% 85%; }
/* above the figure, the size of the whole stage: a raised balloon reaching past the figure's picture, cut at the frame */
.stage canvas.over { transform: none; pointer-events: none; }
.stage.scene .shadow { background: rgba(20, 30, 20, .28); }
.panel { display: grid; gap: 14px; min-width: 0; }
/* the tabs in three groups (the body, the clothes, the rest), each on its own soft panel so they read as belonging together */
.tabs { display: flex; flex-wrap: wrap; gap: 10px; }
.tabgroup { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; padding: 8px; border-radius: 24px; background: var(--group); }
.tabgroup .tab { width: 80px; }
.tab { font: 600 .9rem/1 var(--font-display); border: 0; border-radius: 20px; padding: 8px 6px 10px; cursor: pointer;
  background: var(--tile); color: var(--ink); box-shadow: 0 2px 8px var(--shadow); display: grid; justify-items: center; gap: 4px; }
.tab img { width: 56px; height: 56px; }
.tab[aria-selected="true"] { background: var(--grape); color: #fff; }
.tab:focus-visible, .opt:focus-visible, .sw:focus-visible { outline: 3px solid var(--grape); outline-offset: 2px; }
.box { background: var(--tile); border-radius: 22px; padding: 16px; box-shadow: 0 4px 16px var(--shadow); display: grid; gap: 14px; }
.label { font: 700 .75rem/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.opt { border: 2px solid var(--line); background: var(--ground); color: var(--ink); border-radius: 18px; padding: 6px 6px 10px; cursor: pointer;
  display: grid; gap: 4px; justify-items: center; font: 600 .9rem/1.1 var(--font-display); min-width: 0; }
/* long names (Gymnastikdragt, Fodboldstøvler) break inside the tile instead of running out of it */
.opt span { max-width: 100%; text-align: center; overflow-wrap: break-word; hyphens: manual; -webkit-hyphens: manual; }
.opt canvas, .opt .thumb { min-width: 0; }
.opt canvas { width: 100%; aspect-ratio: 1; border-radius: 12px; background: var(--sun-soft); }
.opt .thumb { width: 100%; aspect-ratio: 1; border-radius: 12px; background: var(--sun-soft) center / cover; }
.opt .thumb.sol { background: radial-gradient(circle at 50% 42%, var(--sun-soft) 0 38%, var(--sun) 100%); }
.opt:disabled { opacity: .35; cursor: default; }
.opt[aria-pressed="true"] { border-color: var(--grape); box-shadow: 0 0 0 2px var(--grape) inset; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.sw { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--tile); box-shadow: 0 0 0 2px var(--line); cursor: pointer; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--grape); }
#nameBox { display: grid; gap: 8px; }
#nameBox[hidden], .opts[hidden] { display: none; }
.name-input { font: 700 1.4rem/1.2 var(--font-display); padding: 10px 14px; border-radius: 16px; border: 2px solid var(--line);
  background: var(--ground); color: var(--ink); width: 100%; max-width: 320px; }
.name-input:focus { outline: 3px solid var(--grape); outline-offset: 1px; }
.badges { display: flex; flex-wrap: wrap; gap: 8px; }
.badge { width: 52px; height: 52px; border-radius: 16px; border: 2px solid var(--line); background: var(--ground); font-size: 1.6rem; cursor: pointer; color: var(--muted); }
.badge[aria-pressed="true"] { border-color: var(--grape); box-shadow: 0 0 0 2px var(--grape) inset; }
.note { color: var(--muted); font-size: .85rem; max-width: 62ch; }
/* the camera button on the stage, and the sheets for saving a picture */
.stage-btn { position: absolute; top: 10px; right: 10px; z-index: 3; width: 48px; height: 48px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--tile); box-shadow: 0 2px 8px var(--shadow); font-size: 1.45rem; line-height: 1; }
.sheet { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(20, 14, 40, .55);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet[hidden] { display: none; }
.sheet-card { background: var(--tile); color: var(--ink); border-radius: 24px; padding: 16px; width: min(440px, 100%); max-height: 100%; overflow: auto;
  display: grid; gap: 12px; box-shadow: 0 10px 30px var(--shadow); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet-head h2 { margin: 0; font: 700 1.3rem/1.1 var(--font-display); }
.sheet-x { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); background: var(--ground); color: var(--ink); font-size: 1.1rem; cursor: pointer; }
.pic-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: end; }
.pic-opt { border: 2px solid var(--line); background: var(--ground); color: var(--ink); border-radius: 18px; padding: 8px 8px 10px; cursor: pointer;
  display: grid; gap: 6px; justify-items: center; font: 600 1rem/1.1 var(--font-display); min-width: 0; }
.pic-opt canvas { width: 100%; height: auto; border-radius: 12px; }
.gate-q { margin: 0; font: 700 1.5rem/1.2 var(--font-display); text-align: center; }
.gate-a { min-height: 2.2rem; font: 700 1.8rem/1.2 var(--font-display); text-align: center; color: var(--grape); }
.gate-a.wrong { color: #E8384F; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.keypad button { height: 52px; border-radius: 16px; border: 2px solid var(--line); background: var(--ground); color: var(--ink); font: 700 1.3rem/1 var(--font-display); cursor: pointer; }
#picImg { width: 100%; border-radius: 16px; }
/* larger screens: the figure stays in view while the choices beside it are scrolled */
.stage { position: sticky; top: 16px; }
/* phones: like an app - the figure always at the top, the tabs in one sideways row under it, and only the choices
   below scroll, so a child sees the result of every tap without scrolling up and down */
@media (max-width: 720px) {
  html, body { overflow: hidden; }
  .wrap { height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); padding-block: 8px 0; display: flex; flex-direction: column; gap: 8px; }
  header { display: none; }
  .main { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; min-width: 0; width: 100%; }
  .panel, .tabs, .box { min-width: 0; width: 100%; max-width: 100%; }
  .stage { position: relative; top: 0; flex: none; height: 44dvh; width: auto; aspect-ratio: 2 / 3; align-self: center; border-radius: 22px; }
  .panel { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
  .tabs { flex: none; flex-wrap: nowrap; overflow-x: auto; gap: 6px 14px; padding: 2px 2px 6px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabgroup { flex-wrap: nowrap; gap: 6px; width: auto; flex: none; padding: 5px; border-radius: 20px; }
  .tabgroup .tab { width: 62px; flex: none; }
  .tab { font-size: .72rem; padding: 6px 3px 7px; border-radius: 16px; }
  .tab img { width: 40px; height: 40px; }
  .box { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; align-content: start; gap: 10px; border-radius: 18px 18px 0 0; }
  .opts { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
}
@media (prefers-reduced-motion: no-preference) { .opt, .sw, .tab { transition: transform .12s; } .opt:active, .sw:active, .tab:active { transform: scale(.96); } }
</style>

<div class="wrap">
  <header>
    <div class="logo" aria-label="MiniMig"><span>M</span><span>i</span><span>n</span><span>i</span><span>M</span><span>i</span><span>g</span></div>
  </header>
  <div class="main">
    <div class="stage" id="stage" aria-label="Figuren – tryk for at zoome"><div class="zoom" id="zoom"><div class="shadow"></div><canvas id="fig" width="512" height="768"></canvas><canvas id="over" class="over" width="512" height="768"></canvas></div>
      <button class="stage-btn" id="saveBtn" aria-label="Gem billede">📷</button></div>
    <div class="panel">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="box">
        <div id="nameBox" hidden>
          <label class="label" for="nameInput">Navn på trøjen</label>
          <input id="nameInput" class="name-input" type="text" maxlength="10" autocomplete="off" placeholder="Skriv dit navn">
          <div class="label" style="margin-top:14px">Mærke</div>
          <div class="badges" id="badges"></div>
        </div>
        <div id="optsWrap"><div class="label" id="optsLabel">Vælg</div></div>
        <div class="opts" id="opts"></div>
        <div id="optsWrap2" hidden><div class="label" id="optsLabel2"></div></div>
        <div class="opts" id="opts2" hidden></div>
        <div id="swWrap"><div class="label" id="swLabel">Farve</div></div>
        <div class="swatches" id="swatches"></div>
      </div>
      <p class="note" hidden></p>
    </div>
  </div>
</div>

<!-- saving a picture: the child picks the whole figure or a profile picture, then a grown-up answers a sum -->
<div class="sheet" id="picChoice" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="picChoiceTitle">
    <div class="sheet-head"><h2 id="picChoiceTitle">Gem billede</h2><button class="sheet-x" data-close aria-label="Luk">✕</button></div>
    <div class="pic-opts">
      <button class="pic-opt" data-pic="hel"><canvas width="200" height="300"></canvas><span>Hele figuren</span></button>
      <button class="pic-opt" data-pic="profil"><canvas width="300" height="300"></canvas><span>Profilbillede</span></button>
    </div>
  </div>
</div>
<div class="sheet" id="gate" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
    <div class="sheet-head"><h2 id="gateTitle">Spørg en voksen</h2><button class="sheet-x" data-close aria-label="Luk">✕</button></div>
    <p class="gate-q" id="gateQ"></p>
    <div class="gate-a" id="gateA" aria-live="polite"></div>
    <div class="keypad" id="keypad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="del" aria-label="Slet">⌫</button><button data-k="0">0</button><button data-k="ok">OK</button>
    </div>
  </div>
</div>
<div class="sheet" id="picSheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="picSheetTitle">
    <div class="sheet-head"><h2 id="picSheetTitle">Dit billede</h2><button class="sheet-x" data-close aria-label="Luk">✕</button></div>
    <img id="picImg" alt="Billedet af figuren">
    <p class="note">Tryk og hold på billedet for at gemme det.</p>
  </div>
</div>

<script>
// ---- the parts: pictures lined up on the same 512x768 base figure ----
const SKIN = ['#F6D0AE', '#EDB98A', '#D9965F', '#B5713F', '#8D5530', '#5A3520'];
const HAIR = ['#2A1C17', '#4A2C1D', '#7A4428', '#A8582E', '#D9A55C', '#F0D9A0', '#FF7EBB', '#5AA9FF'];
const EYES = ['#9C5A1E', '#6B3A1A', '#4A2814', '#2E1A10', '#1A110C', '#3B7BD4', '#3E9A5C', '#A0763A', '#7D8A99', '#8A5CE6'];
const CLOTH = ['#E8384F', '#FF7A2F', '#FFC233', '#2FB872', '#13BFA6', '#3D8BFF', '#7A4DFF', '#FF6FB1', '#F4F1EA', '#3A3550'];
// besides plain colours: a rainbow, and patterns (dots, gingham, stripes) over the last plain colour chosen
const PATTERNS = ['prikker', 'tern', 'striber'], SPECIAL = ['regnbue', ...PATTERNS];
const TABS = [
  { id: 'hud', name: 'Hud', colors: SKIN, key: 'skin' },
  // (hair can also be rainbow-coloured: 'regnbue' paints it in bands of the rainbow's colours from top to bottom)
  { id: 'haar', name: 'Hår', key: 'hair', colorKey: 'hairColor', colors: [...HAIR, 'regnbue'],
    opts: [['haar-bob', 'Pagehår'], ['haar-kort', 'Kort'], ['haar-strit', 'Strithår'], ['haar-kroeller', 'Krøller'], ['haar-fletninger', 'Fletninger']] },
  { id: 'oejne', name: 'Øjne', key: 'eyes', colorKey: 'eyeColor', colors: EYES,
    opts: [['naturlig', 'Naturlige'], ['oejne-store', 'Store'], ['oejne-glad', 'Glade'], ['oejne-blink', 'Blink'],
      ['oejne-vipper', 'Vipper'], ['oejne-stjerne', 'Stjerner'], ['oejne-hjerte', 'Hjerter']] },
  { id: 'bryn', name: 'Øjenbryn', key: 'brows', colorKey: 'browColor', colors: HAIR,
    opts: [['naturlig', 'Naturlige'], ['bryn-tynde', 'Tynde'], ['bryn-tykke', 'Tykke'], ['bryn-hoeje', 'Høje'],
      ['bryn-sure', 'Sure'], ['bryn-triste', 'Triste'], ['bryn-ingen', 'Ingen']] },
  { id: 'mund', name: 'Mund', key: 'mouth',
    opts: [['naturlig', 'Smil'], ['mund-neutral', 'Neutral'], ['mund-grin', 'Grin'], ['mund-tunge', 'Tunge'],
      ['mund-o', 'Åh'], ['mund-kys', 'Kys'], ['mund-trist', 'Trist']] },
  { id: 'oerer', name: 'Ører', key: 'ears',
    opts: [['naturlig', 'Naturlige'], ['oerer-smaa', 'Små'], ['oerer-store', 'Store'], ['oerer-udstaaende', 'Udstående'], ['oerer-alfe', 'Alfeører']],
    // a second row in the same tab: earrings, drawn by the app at the ear lobes
    more: { key: 'earrings', label: 'Øreringe',
      opts: [['ingen', 'Ingen'], ['perler', 'Perler'], ['ringe', 'Guldringe'], ['stjerner', 'Stjerner'], ['hjerter', 'Hjerter']] } },
  { id: 'naese', name: 'Næse', key: 'nose',
    opts: [['naturlig', 'Naturlig'], ['naese-lille', 'Lille'], ['naese-bred', 'Bred'], ['naese-lang', 'Spids'], ['naese-dyr', 'Dyrenæse'], ['naese-klovn', 'Klovn']] },
  // face paint and things on the face; several can be chosen together (multi), each tap turns one on or off
  { id: 'kinder', name: 'Pynt', key: 'cheeks', multi: true,
    opts: [['ingen', 'Ingen'], ['roede', 'Røde kinder'], ['fregner', 'Fregner'], ['hjerter', 'Hjerter'], ['stjerne', 'Stjerne'],
      ['glimmer', 'Glimmer'], ['regnbue', 'Regnbue'], ['plaster', 'Plaster'], ['plet', 'Skønheds­plet']] },
  { id: 'briller', name: 'Briller', key: 'glasses', colorKey: 'glassesColor', colors: CLOTH,
    opts: [['ingen', 'Ingen'], ['briller-runde', 'Runde'], ['briller-firkant', 'Firkantede'], ['briller-sol', 'Solbriller'],
      ['briller-stjerne', 'Stjerner'], ['briller-hjerte', 'Hjerter'], ['briller-ski', 'Skibriller']] },
  { id: 'hat', name: 'Hat', key: 'hat', colorKey: 'hatColor', colors: CLOTH,
    opts: [['ingen', 'Ingen'], ['krone', 'Krone'], ['tiara', 'Tiara'], ['sloejfe', 'Sløjfe'], ['blomst', 'Blomst'], ['kasket', 'Kasket'],
      ['festhat', 'Festhat'], ['enhjoerning', 'Enhjørning'], ['kaninoerer', 'Kaninører'], ['hovedtelefoner', 'Høre­telefoner']] },
  { id: 'troeje', name: 'Trøje', key: 'top', colorKey: 'topColor', colors: [...CLOTH, ...SPECIAL],
    opts: [['ingen', 'Undertrøje'], ['troeje-tshirt', 'T-shirt'], ['troeje-haette', 'Hætte­trøje'], ['troeje-fodbold', 'Fodbold­trøje'], ['troeje-gymnastik', 'Gymnastik/​badedragt']] },
  // a dress takes the top's place (and its colour), so a dress and a top are never worn together
  { id: 'kjoler', name: 'Kjoler', key: 'top', colorKey: 'topColor', colors: [...CLOTH, ...SPECIAL],
    opts: [['ingen', 'Ingen'], ['troeje-ballet', 'Ballet­kjole'], ['kjole-prinsesse', 'Prinsesse'], ['kjole-sommer', 'Sommer­kjole'],
      ['kjole-tyl', 'Tylkjole'], ['kjole-fest', 'Fest­kjole'], ['kjole-havfrue', 'Havfrue'], ['kjole-havfruedragt', 'Havfrue­dragt'], ['kjole-galla', 'Galla']] },
  { id: 'bukser', name: 'Bukser', key: 'pants', colorKey: 'pantsColor', colors: [...CLOTH, ...SPECIAL],
    opts: [['ingen', 'Shorts'], ['bukser-lange', 'Lange bukser'], ['bukser-fodbold', 'Fodbold­shorts']] },
  { id: 'sko', name: 'Sko', key: 'shoes', colorKey: 'shoeColor', colors: CLOTH,
    opts: [['ingen', 'Bare tæer'], ['sko-sneakers', 'Sneakers'], ['sko-fodbold', 'Fodbold­støvler'], ['sko-ballet', 'Balletsko'], ['sko-glas', 'Glassko']] },
  { id: 'stilling', name: 'Stilling', key: 'pose',
    opts: [['ned', 'Står'], ['vink', 'Vinker'], ['vink2', 'Vinker med den anden'], ['hurra', 'Hurra'], ['hofter', 'Hænder i siden'], ['dans', 'Danser'], ['dans2', 'Danser modsat']] },
  { id: 'navn', name: 'Navn' },
  { id: 'haender', name: 'Hænder', key: 'hands', colorKey: 'handColor', colors: CLOTH,
    opts: [['ingen', 'Ingen'], ['neglelak', 'Neglelak'], ['armbaand', 'Armbånd'], ['ur', 'Ur'], ['handsker', 'Handsker'], ['vanter', 'Vanter'], ['ring', 'Ring']] },
  { id: 'ting', name: 'Ting', key: 'item', colorKey: 'itemColor', colors: CLOTH,
    opts: [['ingen', 'Ingen'], ['ballon', 'Ballon'], ['bamse', 'Bamse'], ['tryllestav', 'Tryllestav'], ['is', 'Is'], ['blomst', 'Blomst'], ['bold', 'Bold'], ['fodbold', 'Fodbold'], ['hulahop', 'Hula­hopring']] },

  const full = await stagePicture(), prof = profilePicture(full); // small pictures of both choices
  for (const [kind, p] of [['hel', full], ['profil', prof]]) { const cv = document.querySelector(`[data-pic="${kind}"] canvas`), g = cv.getContext('2d');
    g.clearRect(0, 0, cv.width, cv.height); g.imageSmoothingQuality = 'high'; g.drawImage(p, 0, 0, cv.width, cv.height); }
});
document.getElementById('picChoice').addEventListener('click', e => { const b = e.target.closest('[data-pic]'); if (!b) return;
  document.getElementById('picChoice').hidden = true; const kind = b.dataset.pic;
  askGrownUp(() => sharePicture(kind).catch(() => {})); });
for (const s of document.querySelectorAll('.sheet')) s.addEventListener('click', e => { if (e.target === s || e.target.closest('[data-close]')) s.hidden = true; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') for (const s of document.querySelectorAll('.sheet')) s.hidden = true; });

try { Object.assign(state, JSON.parse(localStorage.getItem('minimig2') || '{}')); } catch (e) {}
// a choice saved earlier that the app no longer has (e.g. the vampire mouth) goes back to the tab's first choice
// (a key shared by two tabs - tops and dresses - is fine if either tab has the choice)
state.cheeks = cheeksOf(state);
if (PATTERNS.includes(state.hairColor)) state.hairColor = patBase(state, 'hairColor'); // (hair has no patterns any more)
for (const t of TABS) if (t.opts && t.key && !t.multi && state[t.key] !== undefined &&
  !TABS.some(u => u.key === t.key && u.opts && u.opts.some(o => o[0] === state[t.key]))) state[t.key] = t.opts[0][0];
for (const t of TABS) if (t.more && state[t.more.key] !== undefined && !t.more.opts.some(o => o[0] === state[t.more.key])) state[t.more.key] = t.more.opts[0][0];
const POSES = ['vink', 'hurra', 'hofter', 'dans'];
const TOPS = ['troeje-tshirt', 'troeje-haette', 'troeje-fodbold', 'troeje-fodbold-inde', 'troeje-gymnastik', ...DRESSES];
const names = ['grund', 'laar-bare2', 'haar-bob', 'haar-kort', 'haar-strit', 'haar-kroeller', 'haar-fletninger', ...TOPS, 'bukser-lange', 'bukser-fodbold', 'sko-sneakers', 'sko-fodbold', 'sko-ballet', 'sko-glas',
  ...POSES.map(p => 'grund-' + p), ...POSES.flatMap(p => TOPS.map(t => t + '-' + p)),
  ...['oejne', 'bryn', 'mund', 'naese', 'oerer', 'briller'].flatMap(id => TABS.find(t => t.id === id).opts.map(o => o[0]).filter(n => n !== 'naturlig' && n !== 'ingen'))];
const GEAR_PICS = [...Object.values(GEAR).map(g => g.pic), ...Object.keys(HATS).map(h => 'hat-' + h), ...Object.keys(ITEMS).map(n => 'hand-' + n)]; // not prepared as parts
Promise.all([...names, ...GEAR_PICS].map(n => load(n))).then(list => {
  for (const [n, im] of list) { if (!im) continue; img[n] = im; if (!GEAR_PICS.includes(n)) prepare(n, im); }
  if (!data.grund) { // without the figure itself there is nothing to show
    const n = document.querySelector('.note'); n.hidden = false; n.textContent = 'Billederne kunne ikke hentes. Tjek internetforbindelsen, og genindlæs siden.'; return; }
  try { draw(); render(); } catch (e) { console.error(e); }
  if (document.fonts) document.fonts.ready.then(draw); }); // redraw once the rounded font has arrived, for the name
</script>
