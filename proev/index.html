/* Layout: the figure on a sunny stage (the app icon's light), the wardrobe beside it; stacked on a phone. */

:root[data-theme="dark"] {
  --sun: #E0B43A; --sun-soft: #3A2F5E; --ground: #1D1738; --ink: #F5F1FF; --muted: #B7AEDB;

html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font: 600 15px/1.45 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1000px; margin: 0 auto; padding-block: 18px 32px; display: grid; gap: 18px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.logo { font: 700 1.9rem/1 var(--font-display); display: flex; }
.logo span:nth-child(6n+1) { color: #FF4F8B } .logo span:nth-child(6n+2) { color: #FF7A2F }
.logo span:nth-child(6n+3) { color: #F2A900 } .logo span:nth-child(6n+4) { color: #13BFA6 }
.logo span:nth-child(6n+5) { color: #3D8BFF } .logo span:nth-child(6n+6) { color: var(--grape) }

.main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 20px; align-items: start; }
.stage { position: relative; border-radius: 28px; aspect-ratio: 2 / 3; max-width: 100%;
  background: radial-gradient(circle at 50% 42%, var(--sun-soft) 0 38%, var(--sun) 100%); box-shadow: 0 10px 30px var(--shadow); overflow: hidden; }
.stage { cursor: zoom-in; }
.stage.zoomed { cursor: zoom-out; }
/* everything on the stage (scene, shadow, figure) zooms together, e.g. in on the face for the Eyes tab */
.stage .zoom { position: absolute; inset: 0; transform-origin: 0 0; background-size: cover; background-position: center; }
@media (prefers-reduced-motion: no-preference) { .stage .zoom { transition: transform .45s ease; } }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.stage .shadow { position: absolute; left: 30%; right: 30%; bottom: 13.5%; height: 3%; border-radius: 50%; background: rgba(43, 33, 83, .16); filter: blur(4px); }
/* the figure stands a little smaller than the stage, feet on the same spot, the same size on the sun and on a scene */
.stage canvas, .stage .shadow { transform: scale(.86); transform-origin: 50% 85%; }
/* above the figure, the size of the whole stage: a raised balloon reaching past the figure's picture, cut at the frame */
.stage canvas.over { transform: none; pointer-events: none; }
.stage.scene .shadow { background: rgba(20, 30, 20, .28); }
.panel { display: grid; gap: 14px; min-width: 0; }

.tabgroup { display: flex; flex-wrap: wrap; gap: 8px; }

.name-input { font: 700 1.4rem/1.2 var(--font-display); padding: 10px 14px; border-radius: 16px; border: 2px solid var(--line);
  background: var(--ground); color: var(--ink); width: 100%; max-width: 320px; }
.name-input:focus { outline: 3px solid var(--grape); outline-offset: 1px; }
.badges { display: flex; flex-wrap: wrap; gap: 8px; }

.badge[aria-pressed="true"] { border-color: var(--grape); box-shadow: 0 0 0 2px var(--grape) inset; }
.note { color: var(--muted); font-size: .85rem; max-width: 62ch; }
/* larger screens: the figure stays in view while the choices beside it are scrolled */
.stage { position: sticky; top: 16px; }
/* phones: like an app - the figure always at the top, the tabs in one sideways row under it, and only the choices
   below scroll, so a child sees the result of every tap without scrolling up and down */
@media (max-width: 720px) {
  html, body { overflow: hidden; }
  .wrap { height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); padding-block: 8px 0; display: flex; flex-direction: column; gap: 8px; }
  header { display: none; }
  .main { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; min-width: 0; width: 100%; }
  .panel, .tabs, .box { min-width: 0; width: 100%; max-width: 100%; }
  .stage { position: relative; top: 0; flex: none; height: 44dvh; width: auto; aspect-ratio: 2 / 3; align-self: center; border-radius: 22px; }
  .panel { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
  .tabs { flex: none; flex-wrap: nowrap; overflow-x: auto; gap: 6px 14px; padding: 2px 2px 6px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabgroup { flex-wrap: nowrap; gap: 6px; }
  .tabgroup .tab { width: 62px; flex: none; }
  .tab { font-size: .72rem; padding: 6px 3px 7px; border-radius: 16px; }
  .tab img { width: 40px; height: 40px; }
  .box { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; align-content: start; gap: 10px; border-radius: 18px 18px 0 0; }
  .opts { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
}
@media (prefers-reduced-motion: no-preference) { .opt, .sw, .tab { transition: transform .12s; } .opt:active, .sw:active, .tab:active { transform: scale(.96); } }

const img = {}, data = {};

  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d'); g.drawImage(im, 0, 0, W, H);

    const dots = [[-8, -3], [-3, -6], [2, -2], [6, -5], [-5, 2], [1, 3], [7, 1], [-1, -9]];
    for (const [x, y] of CHEEKS) for (const [dx, dy] of dots) { ctx.beginPath(); ctx.arc(x + dx * (x < 256 ? 1 : -1), y + dy, .95, 0, Math.PI * 2); ctx.fill(); }
    for (const [dx, dy] of [[-4, -1], [0, -3], [4, -1]]) { ctx.beginPath(); ctx.arc(256 + dx, 168 + dy, .85, 0, Math.PI * 2); ctx.fill(); } } // over the nose
  const heart = (x, y, r) => { ctx.beginPath(); ctx.moveTo(x, y + r * .9);
    ctx.bezierCurveTo(x - r * 1.6, y - r * .2, x - r * .7, y - r * 1.4, x, y - r * .45);
    ctx.bezierCurveTo(x + r * .7, y - r * 1.4, x + r * 1.6, y - r * .2, x, y + r * .9); ctx.fill(); };
  const star = (x, y, R, r, col) => { ctx.fillStyle = col; ctx.beginPath();
    for (let k = 0; k < 10; k++) { const rr = k % 2 ? r : R, a = -Math.PI / 2 + k * Math.PI / 5; ctx.lineTo(x + rr * Math.cos(a), y + rr * Math.sin(a)); } ctx.fill(); };
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.18)'; ctx.shadowBlur = 1;
  if (has('hjerter')) { ctx.fillStyle = '#FF4F8B'; for (const [x, y] of CHEEKS) heart(x, y, 5); }
  if (has('stjerne')) star(CHEEKS[1][0], CHEEKS[1][1], 6.5, 2.6, '#FFC233');
  if (has('regnbue')) { const [x, y] = CHEEKS[0]; // a little painted rainbow on the left cheek
    ['#FF5A5A', '#FFA43B', '#FFD93B', '#5BD16E', '#4EA8FF', '#9B6BFF'].forEach((col, k) => {
      ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y + 4, 9 - k * 1.4, Math.PI, 0); ctx.stroke(); }); }
  if (has('glimmer')) // small twinkling stars round the face
    [[196, 128, 4.5, '#FFD43B'], [318, 124, 3.8, '#FFFFFF'], [314, 190, 3.2, '#FFD43B'], [198, 192, 3, '#FFFFFF'], [328, 156, 2.6, '#FF9EC4']]
      .forEach(([x, y, R, col]) => star(x, y, R, R * .35, col));
  ctx.restore();
  if (has('plaster')) { ctx.save(); ctx.translate(299, 186); ctx.rotate(-.45); // a plaster on the right cheek
    ctx.fillStyle = '#F3C38F'; ctx.beginPath(); ctx.roundRect(-12, -5, 24, 10, 5); ctx.fill();
    ctx.fillStyle = '#E5AE77'; ctx.fillRect(-5, -5, 10, 10);
    ctx.fillStyle = '#C98D55'; for (const [dx, dy] of [[-2, -2], [2, 2], [2, -2], [-2, 2]]) { ctx.beginPath(); ctx.arc(dx, dy, .7, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore(); }
  ctx.restore();
}

// The name on the chest: rounded letters sized to fit, in white or dark ink, whichever reads on the top's colour.
const CHEST = { x: 256, y: 282, maxW: 104 };
// A made-up club crest (not any real club's): a small navy shield with a white rim, a white sash and a gold star.
// Where it sits on each part: [centre x, centre y, height] on the 512x768 figure (upper left of the chest, left leg).
const CREST = { troeje: { 'troeje-fodbold': [222, 250, 22] }, bukser: { 'bukser-fodbold': [224, 447, 16] } };
function drawCrest(ctx, [cx, cy, h], flip = false) {
  const w = h * .82;
  const shield = () => { ctx.beginPath(); ctx.moveTo(-w / 2, -h / 2); ctx.lineTo(w / 2, -h / 2); ctx.lineTo(w / 2, h * .05);
    ctx.quadraticCurveTo(w / 2, h * .35, 0, h / 2); ctx.quadraticCurveTo(-w / 2, h * .35, -w / 2, h * .05); ctx.closePath(); };
  ctx.save(); if (flip) { ctx.translate(W, 0); ctx.scale(-1, 1); } ctx.translate(cx, cy);
  ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 1.5; ctx.shadowOffsetY = .6;
  shield(); ctx.fillStyle = '#FFFFFF'; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.scale(.8, .82); shield(); ctx.save(); ctx.clip();
  const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2); g.addColorStop(0, '#2A4FB8'); g.addColorStop(1, '#16296E');
  ctx.fillStyle = g; ctx.fillRect(-w, -h, 2 * w, 2 * h);
  ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = h * .2; ctx.beginPath(); ctx.moveTo(-w, h * .75); ctx.lineTo(w, -h * .45); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = '#FFC233'; ctx.beginPath(); // a five-pointed star in the upper corner
  for (let k = 0; k < 10; k++) { const r = k % 2 ? h * .07 : h * .17, a = -Math.PI / 2 + k * Math.PI / 5;
    ctx.lineTo(-w * .17 + r * Math.cos(a), -h * .17 + r * Math.sin(a)); }
  ctx.fill(); ctx.restore();
}

function printName(s, ctx, flip = false) {
  const name = (s.name || '').trim().slice(0, 10), badge = (BADGES.find(b => b[0] === s.badge) || ['', ''])[1];
  const col = s.top === 'ingen' ? '#2B4BD8' : s.topColor, [r, g, b] = hex(col), light = lum(r, g, b) > .62;
  const ink = light ? '#2B2153' : '#FFFFFF';
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (flip) { ctx.translate(W, 0); ctx.scale(-1, 1); } // printed backwards, so it reads right once the figure is turned
  let y = CHEST.y;
  if (badge) { ctx.font = `${name ? 20 : 30}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; ctx.fillText(badge, CHEST.x, name ? y - 16 : y); }
  if (name) {
    let size = 26; ctx.font = `700 ${size}px Fredoka, "Arial Rounded MT Bold", sans-serif`;
    while (ctx.measureText(name).width > CHEST.maxW && size > 11) { size--; ctx.font = `700 ${size}px Fredoka, "Arial Rounded MT Bold", sans-serif`; }
    const ty = badge ? y + 10 : y;
    ctx.shadowColor = light ? 'rgba(255,255,255,.35)' : 'rgba(0,0,0,.25)'; ctx.shadowOffsetY = 1; ctx.shadowBlur = 1.5;
    ctx.fillStyle = ink; ctx.fillText(name, CHEST.x, ty);
  }
  ctx.restore();
}

const fig = document.getElementById('fig').getContext('2d', { willReadFrequently: true });
function scene() {
  const st = document.getElementById('stage'), bg = state.bg && state.bg !== 'sol' ? state.bg : '';
  st.classList.toggle('scene', !!bg); document.getElementById('zoom').style.backgroundImage = bg ? `url("baggrund/${bg}.jpg")` : '';
  zoom();
}
// Tabs about the face zoom the stage in on it (a tap on the figure zooms out and in again): [x, y on the figure, scale]
const ZOOM_VIEW = { oejne: [256, 150, 2.2], bryn: [256, 150, 2.2], mund: [256, 160, 2.2], kinder: [256, 160, 2.2], naese: [256, 160, 2.2], hat: [256, 120, 1.7], briller: [256, 150, 2.2] };
let zoomOn = true;
const FIG_SCALE = .86; // as in the CSS (.stage canvas)
function zoom() {
  const st = document.getElementById('stage'), v = zoomOn && ZOOM_VIEW[tab];
  st.classList.toggle('zoomed', !!v);
  if (!v) { document.getElementById('zoom').style.transform = ''; return; }
  let px = v[0] / W, py = v[1] / H; const k = v[2];
  px = .5 + (px - .5) * FIG_SCALE; py = .85 + (py - .85) * FIG_SCALE; // the figure stands a little smaller on the stage
  const s = k / FIG_SCALE, clamp = t => Math.min(0, Math.max(1 - s, t));
  document.getElementById('zoom').style.transform = `translate(${clamp(.5 - px * s) * 100}%, ${clamp(.45 - py * s) * 100}%) scale(${s})`;
}
document.getElementById('stage').addEventListener('click', () => { if (ZOOM_VIEW[tab]) { zoomOn = !zoomOn; zoom(); } });
// a balloon held high is drawn on the stage-sized sheet, so it is cut off by the frame and not by the figure's picture
function drawOver(st) {
  const g = document.getElementById('over').getContext('2d'); g.clearRect(0, 0, W, H);
  if (!st._overBalloon) return;
  const k = FIG_SCALE; g.save(); g.translate(256 * (1 - k), H * .85 * (1 - k)); g.scale(k, k);
  if (mirrored(st)) { g.translate(W, 0); g.scale(-1, 1); }
  drawItem(g, { ...st, _over: false, _overBalloon: false }); g.restore();
}
function draw() { const st = { ...state, _over: true }; compose(st, fig); drawOver(st); scene(); try { localStorage.setItem('minimig2', JSON.stringify(state)); } catch (e) {} }

// small previews of each choice, cropped round the part
const CROP = { haar: [100, 30, 310, 310], troeje: [100, 200, 310, 310], kjoler: [56, 160, 400, 470], bukser: [130, 390, 250, 250], sko: [150, 560, 210, 210], stilling: [26, 30, 460, 460], oejne: [181, 96, 150, 150], bryn: [181, 90, 150, 150], mund: [196, 130, 120, 120], kinder: [186, 110, 140, 140], naese: [206, 125, 100, 100], hat: [146, 10, 220, 220], briller: [176, 90, 160, 160], ting: [26, 30, 460, 460], sport: [26, 200, 460, 460] };
function preview(canvas, s, t) {
  const big = document.createElement('canvas'); big.width = W; big.height = H; const g = big.getContext('2d'); compose(s, g);
  const [x, y, w, h] = CROP[t]; const c = canvas.getContext('2d'); c.clearRect(0, 0, canvas.width, canvas.height); c.drawImage(big, x, y, w, h, 0, 0, canvas.width, canvas.height);
}

function render() {
  const t = TABS.find(x => x.id === tab);
  const tabBtn = x => `<button class="tab" role="tab" id="tab-${x.id}" aria-selected="${x.id === tab}" data-tab="${x.id}"><img src="ikoner/${x.id}.png" alt="" width="56" height="56"><span>${x.name}</span></button>`;
  const tabsEl = document.getElementById('tabs'), keep = tabsEl.scrollLeft; // on a phone the row of tabs keeps its place
  tabsEl.innerHTML = TAB_GROUPS.map(g =>
    `<div class="tabgroup">${g.map(id => tabBtn(TABS.find(x => x.id === id))).join('')}</div>`).join('');
  tabsEl.scrollLeft = keep;
  const nameBox = document.getElementById('nameBox'); nameBox.hidden = t.id !== 'navn';
  if (t.id === 'navn') {
    const inp = document.getElementById('nameInput'); if (document.activeElement !== inp) inp.value = state.name || '';
    document.getElementById('badges').innerHTML = BADGES.map(([v, e]) =>
      `<button class="badge" id="badge-${v}" data-badge="${v}" aria-pressed="${(state.badge || 'ingen') === v}" aria-label="${v}">${e || '✕'}</button>`).join('');
  }
  const opts = document.getElementById('opts'); document.getElementById('optsWrap').hidden = !t.opts; opts.hidden = !t.opts; opts.innerHTML = '';
  if (t.opts) { document.getElementById('optsLabel').textContent = t.name;
    for (const [v, label] of t.opts) {
      const b = document.createElement('button'); b.className = 'opt'; b.id = `opt-${v}`; b.setAttribute('aria-pressed', t.multi ? (v === 'ingen' ? !cheeksOf(state).length : cheeksOf(state).includes(v)) : state[t.key] === v); b.dataset.val = v;
      if (t.id === 'baggrund') { // a scene is shown as itself
        b.innerHTML = `<div class="thumb${v === 'sol' ? ' sol' : ''}"${v === 'sol' ? '' : ` style="background-image:url('baggrund/${v}.jpg')"`}></div><span>${label}</span>`;
        opts.appendChild(b); continue; }
      b.innerHTML = `<canvas width="160" height="160"></canvas><span lang="da">${label}</span>`; opts.appendChild(b);
      // a thing that cannot be held in the chosen pose, or a pose that cannot hold the chosen thing, is greyed out
      if ((t.id === 'ting' && itemBlocked(state, v)) || (t.id === 'stilling' && itemBlocked({ ...state, pose: v }, state.item))) b.disabled = true;
      // a sport's picture shows its whole kit, as one tap on it puts it on
      preview(b.querySelector('canvas'), { ...state, [t.key]: t.multi ? (v === 'ingen' ? [] : [v]) : v, ...(t.id === 'sport' ? SPORT_KIT[v] : {}) }, t.id); } }
  const ck = t.colorKey || t.key, show = !!t.colors && (t.id === 'hud' || state[t.key] !== 'ingen');
  document.getElementById('swLabel').textContent = t.id === 'hud' ? 'Hudfarve' : 'Farve';
  document.getElementById('swWrap').hidden = !show; const sw = document.getElementById('swatches'); sw.hidden = !show;
  sw.innerHTML = (t.colors || []).map(c => `<button class="sw" id="sw-${c.slice(1)}" style="background:${c}" aria-label="Farve ${c}" aria-pressed="${state[ck] === c}" data-col="${c}"></button>`).join('');
}

document.addEventListener('click', e => {
  const tb = e.target.closest('[data-tab]'); if (tb) { tab = tb.dataset.tab; zoomOn = true; render(); zoom();
    document.querySelector('.box').scrollTop = 0; // a new tab's choices start from the top
    const row = document.getElementById('tabs'), b = document.getElementById('tab-' + tab); // the chosen tab fully in view
    if (b && row.scrollWidth > row.clientWidth) { const l = b.offsetLeft - row.offsetLeft, r = l + b.offsetWidth;
      if (l < row.scrollLeft) row.scrollLeft = l - 8; else if (r > row.scrollLeft + row.clientWidth) row.scrollLeft = r - row.clientWidth + 8; }
    return; }
  const t = TABS.find(x => x.id === tab);
  const op = e.target.closest('.opt'); if (op && t.multi) { const v = op.dataset.val; let l = cheeksOf(state).slice();
    if (v === 'ingen') l = []; else if (l.includes(v)) l = l.filter(x => x !== v);
    else { l = l.filter(x => !(CHEEK_CLASH[v] || []).includes(x)); l.push(v); }
    state[t.key] = l; draw(); render(); return; }
  if (op) { state[t.key] = op.dataset.val;
    if (t.id === 'sport') Object.assign(state, SPORT_KIT[op.dataset.val] || {}); draw(); render(); return; }
  const sw = e.target.closest('.sw'); if (sw) { state[t.colorKey || t.key] = sw.dataset.col; draw(); render(); return; }
  const bg = e.target.closest('[data-badge]'); if (bg) { state.badge = bg.dataset.badge; draw(); render(); }
});
document.getElementById('nameInput').addEventListener('input', e => { state.name = e.target.value.slice(0, 10); draw(); });

try { Object.assign(state, JSON.parse(localStorage.getItem('minimig2') || '{}')); } catch (e) {}
// a choice saved earlier that the app no longer has (e.g. the vampire mouth) goes back to the tab's first choice
// (a key shared by two tabs - tops and dresses - is fine if either tab has the choice)
state.cheeks = cheeksOf(state);
for (const t of TABS) if (t.opts && t.key && !t.multi && state[t.key] !== undefined &&
  !TABS.some(u => u.key === t.key && u.opts && u.opts.some(o => o[0] === state[t.key]))) state[t.key] = t.opts[0][0];
const POSES = ['vink', 'hurra', 'hofter', 'dans'];
const TOPS = ['troeje-tshirt', 'troeje-haette', 'troeje-fodbold', 'troeje-fodbold-inde', 'troeje-gymnastik', ...DRESSES];
const names = ['grund', 'laar-bare2', 'haar-bob', 'haar-kort', 'haar-kroeller', 'haar-fletninger', ...TOPS, 'bukser-lange', 'bukser-fodbold', 'sko-sneakers', 'sko-fodbold', 'sko-ballet',
  ...POSES.map(p => 'grund-' + p), ...POSES.flatMap(p => TOPS.map(t => t + '-' + p)),
  ...['oejne', 'bryn', 'mund', 'naese', 'briller'].flatMap(id => TABS.find(t => t.id === id).opts.map(o => o[0]).filter(n => n !== 'naturlig' && n !== 'ingen'))];
const GEAR_PICS = [...Object.values(GEAR).map(g => g.pic), ...Object.keys(HATS).map(h => 'hat-' + h), ...Object.keys(ITEMS).map(n => 'hand-' + n)]; // not prepared as parts
Promise.all([...names, ...GEAR_PICS].map(n => load(n))).then(list => {
  for (const [n, im] of list) { if (!im) continue; img[n] = im; if (!GEAR_PICS.includes(n)) prepare(n, im); }
  if (!data.grund) { // without the figure itself there is nothing to show
    const n = document.querySelector('.note'); n.hidden = false; n.textContent = 'Billederne kunne ikke hentes. Tjek internetforbindelsen, og genindlæs siden.'; return; }
  try { draw(); render(); } catch (e) { console.error(e); }
  if (document.fonts) document.fonts.ready.then(draw); }); // redraw once the rounded font has arrived, for the name
</script>
